name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Volatility 3 / YARA are optional at runtime, so the tests only need the core stack.
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "streamlit>=1.50" "plotly>=6" pandas sqlalchemy reportlab python-dotenv \
                      stix2 psutil numpy cryptography requests pypdf pytest
      - name: Run tests
        run: pytest tests -q
